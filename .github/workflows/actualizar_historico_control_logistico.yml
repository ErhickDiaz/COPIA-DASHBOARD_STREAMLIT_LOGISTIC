name: Actualizar histórico Control Logístico

on:
  push:
    branches:
      - main
    paths:
      - "data/Control_Logistico.csv"
      - ".github/scripts/actualizar_historico_control_logistico.py"
      - ".github/workflows/actualizar_historico_control_logistico.yml"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar-historico:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Ejecutar actualización de histórico
        run: |
          python .github/scripts/actualizar_historico_control_logistico.py

      - name: Verificar cambios
        id: cambios
        run: |
          if git diff --quiet data/Historico_Control_Logistico.csv; then
            echo "hay_cambios=false" >> $GITHUB_OUTPUT
          else
            echo "hay_cambios=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit histórico actualizado
        if: steps.cambios.outputs.hay_cambios == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/Historico_Control_Logistico.csv
          git commit -m "Actualización automática Historico_Control_Logistico.csv"
          git push

      - name: Sin cambios
        if: steps.cambios.outputs.hay_cambios == 'false'
        run: |
          echo "No hubo cambios nuevos para actualizar en el histórico."
